[package]
name = "keyviz-wayland-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keyviz_wayland_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Todas estas dependencias son exclusivas de Linux: `evdev` lee /dev/input
# directamente, `xkbcommon` traduce esos keycodes, y `gtk-layer-shell`
# convierte la ventana en una layer-surface de Wayland. Este fork solo
# apunta a compositores wlr-layer-shell (niri, sway...) sobre Linux; no
# se ha intentado que compile en macOS/Windows.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
xkbcommon = "0.9"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

